# Copy to ~/.config/cam-watch/config.ini (or point $CAM_WATCH_CONFIG at it), then edit.
# Keep it private: chmod 600 ~/.config/cam-watch/config.ini

[camera]
# Main (high-quality) stream: clips, timelapse and TV use it. Any URL ffmpeg and OpenCV can open:
# rtsp://, rtsps://, http:// (MJPEG), HLS (.m3u8). See README for the URLs of common brands.
url = rtsp://192.168.1.10:554/stream1
# Optional low-resolution sub stream for detection. It saves a lot of CPU. Empty = use url.
detect_url = rtsp://192.168.1.10:554/stream2
# Login, added to both URLs (special characters are encoded for you). Empty = no login, or put it in the URL.
user = admin
password = change-me
# Folder for clips/, faces/ and timelapse/. Empty = the project folder. Use one folder per camera.
data_dir =

[detect]
# COCO class names: person, bicycle, car, motorcycle, bus, truck, bird, cat, dog, horse, sheep, cow, bear, ...
objects = person, cat, dog, bird
confidence = 0.5
checks_per_second = 2
clip_seconds = 30
cooldown = 60
# Any Ultralytics model name or file in models/. Bigger = more accurate and slower: yolo11n, yolo11s, yolo11m.
model = yolo11n.pt

[telegram]
# Optional. Create a bot with @BotFather for the token. Send the bot a message, then open
# https://api.telegram.org/bot<TOKEN>/getUpdates to find chat_id. Empty = no alerts.
token =
chat_id =

[tv]
# Optional. IP of an Android TV device with network debugging on and VLC installed. Empty = TV display off.
host =
