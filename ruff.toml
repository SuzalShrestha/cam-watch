line-length = 160

[lint]
ignore = [
  "E401", "I001",  # short stdlib imports stay on one line
  "E731",          # small lambdas
  "BLE001",        # optional features (Telegram, faces, TV) catch everything so they never stop recording
  "PLW1510",       # adb calls are best effort; ffmpeg calls that matter pass check=True
]
